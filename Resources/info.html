<!doctype html><html lang="it"><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src https: http: data:"><style>
*{box-sizing:border-box}body{margin:0;background:transparent;color:#edf6ff;font:16px -apple-system,sans-serif;opacity:0;transition:opacity .22s}body.shown{opacity:1}article{position:fixed;bottom:5vh;left:5%;right:5%;max-height:85vh;overflow:hidden;background:#0c1b2be0;border:1px solid #7fbdcf66;border-radius:16px;padding:24px;box-shadow:0 12px 40px #0005}header{display:flex;align-items:center;gap:16px}#logo{width:58px;height:58px;object-fit:contain;background:#dbeaf1;border-radius:9px}h1{margin:0;font-size:25px}#resolution,time{color:#a8c6db;font-size:13px}h2{font-size:20px;margin:18px 0 7px}p{line-height:1.5;margin:8px 0}#description{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;color:#c7d7e5;font-size:14px}progress{width:100%;height:5px;accent-color:#72d7de}#next{border-top:1px solid #536c8055;padding-top:12px;font-size:14px}#missing{color:#9fb4c8;font-size:13px}@media(max-width:600px){article{padding:15px}h1{font-size:19px}h2{font-size:16px}#description{-webkit-line-clamp:3}}
</style><article><header><img id="logo" alt=""><div><h1 id="name"></h1><div id="resolution"></div></div></header><section id="programme"><h2 id="title"></h2><time id="time"></time><progress id="progress" max="1"></progress><p id="description"></p></section><p id="missing">Programmazione non disponibile</p><p id="next"></p></article><script>
function renderInfo(d){const $=id=>document.getElementById(id),clock=n=>new Date(n*1000).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});$('name').textContent=d.name;$('resolution').textContent=d.resolution;const logo=$('logo');if(/^https?:/.test(d.logo)){if(logo.getAttribute('src')!==d.logo)logo.src=d.logo;logo.hidden=false;logo.onerror=()=>logo.hidden=true}else logo.hidden=true;$('programme').hidden=!d.now;$('missing').hidden=!!d.now;if(d.now){$('title').textContent=d.now.title;$('time').textContent=clock(d.now.start)+(d.now.end?' — '+clock(d.now.end):'');$('progress').hidden=!d.now.end;$('progress').value=d.now.end?Math.max(0,Math.min(1,(Date.now()/1000-d.now.start)/(d.now.end-d.now.start))):0;$('description').textContent=d.now.description||''}$('next').hidden=!d.next;$('next').textContent=d.next?'A seguire · '+clock(d.next.start)+' · '+d.next.title:'';}
</script></html>
