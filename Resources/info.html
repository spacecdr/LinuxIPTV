<!doctype html><html lang="it"><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src https: http: data:"><style>
*{box-sizing:border-box}body{margin:0;background:transparent;color:#edf6ff;font:16px -apple-system,sans-serif;opacity:0;transition:opacity .22s}body.shown{opacity:1}article{position:fixed;bottom:5vh;left:5%;right:5%;max-height:85vh;overflow:auto;background:#0c1b2be0;border:1px solid #7fbdcf66;border-radius:16px;padding:24px;box-shadow:0 12px 40px #0005}header{display:flex;align-items:center;gap:16px}#logo{width:58px;height:58px;object-fit:contain;background:#dbeaf1;border-radius:9px}h1{margin:0;font-size:25px}#resolution,time{color:#a8c6db;font-size:13px}h2{font-size:20px;margin:18px 0 7px}p{line-height:1.5;margin:8px 0}#description{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;color:#c7d7e5;font-size:14px}progress{width:100%;height:5px;accent-color:#72d7de}#next{border-top:1px solid #536c8055;padding-top:12px;font-size:14px}#missing{color:#9fb4c8;font-size:13px}@media(max-width:600px){article{padding:15px}h1{font-size:19px}h2{font-size:16px}#description{-webkit-line-clamp:3}}
.remote{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px solid #536c8055;margin-top:14px;padding-top:12px}.remote button,.remote select{background:#224158;color:inherit;border:1px solid #658da366;border-radius:8px;padding:8px;font:inherit;font-size:13px}.remote input{width:100px;accent-color:#72d7de}.remote label{font-size:12px}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #72d7de}</style><article><header><img id="logo" alt=""><div><h1 id="name"></h1><div id="resolution"></div></div></header><section id="programme"><h2 id="title"></h2><time id="time"></time><progress id="progress" max="1"></progress><p id="description"></p></section><p id="missing">Programmazione non disponibile</p><p id="next"></p><div class="remote"><button onclick="send('pause')" aria-label="Pausa o riprendi">Ⅱ / ▶</button><button onclick="send('stop')">■ Stop</button><button onclick="send('infoStep',{delta:-1})">CH−</button><button onclick="send('infoStep',{delta:1})">CH+</button><button id="mute" onclick="send('mute')">Audio</button><input id="volume" type="range" min="0" max="100" aria-label="Volume" oninput="send('volume',{value:Number(this.value)})"><label>Buffer <select id="buffer" onchange="send('buffer',{value:Number(this.value)})"><option value="1">1 s</option><option value="3">3 s</option><option value="6">6 s</option><option value="10">10 s</option></select></label></div></article><script>
function send(action,values={}){window.webkit?.messageHandlers.native.postMessage({action,...values})}
function reportBounds(){const r=document.querySelector('article').getBoundingClientRect();send('infoBounds',{x:r.x,y:r.y,width:r.width,height:r.height})}
new ResizeObserver(reportBounds).observe(document.querySelector('article'));window.addEventListener('resize',reportBounds);
function renderInfo(d){const $=id=>document.getElementById(id),clock=n=>new Date(n*1000).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});$('mute').textContent=d.muted?'Muto':'Audio';$('mute').setAttribute('aria-pressed',String(!!d.muted));if(document.activeElement!==$('volume'))$('volume').value=d.volume??70;$('buffer').value=d.buffer??3;$('name').textContent=d.name;$('resolution').textContent=d.resolution;const logo=$('logo');if(/^https?:/.test(d.logo)){if(logo.getAttribute('src')!==d.logo)logo.src=d.logo;logo.hidden=false;logo.onerror=()=>logo.hidden=true}else logo.hidden=true;$('programme').hidden=!d.now;$('missing').hidden=!!d.now;if(d.now){$('title').textContent=d.now.title;$('time').textContent=clock(d.now.start)+(d.now.end?' — '+clock(d.now.end):'');$('progress').hidden=!d.now.end;$('progress').value=d.now.end?Math.max(0,Math.min(1,(Date.now()/1000-d.now.start)/(d.now.end-d.now.start))):0;$('description').textContent=d.now.description||''}$('next').hidden=!d.next;$('next').textContent=d.next?'A seguire · '+clock(d.next.start)+' · '+d.next.title:'';}
</script></html>
